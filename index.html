<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenRouter Chat</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="chat-container">
    <header class="chat-header">
      <h1>OpenRouter Chat</h1>
      <button id="settings-btn" class="icon-btn" title="Settings">⚙️</button>
    </header>

    <div id="settings-panel" class="settings-panel hidden">
      <div class="settings-content">
        <label for="api-key-input">API Key</label>
        <input type="password" id="api-key-input" placeholder="Enter your OpenRouter API key">

        <div class="model-selector-header">
          <label for="model-select">Model</label>
          <div class="model-controls">
            <button id="refresh-models-btn" class="icon-btn" title="Refresh models list">🔄</button>
            <span id="cache-age" class="cache-age"></span>
          </div>
        </div>

        <div class="model-filters">
          <input type="text" id="model-search" placeholder="Search models..." class="search-input">
          <select id="model-sort" class="sort-select">
            <option value="name">Sort by Name</option>
            <option value="created">Sort by Release Date</option>
            <option value="context">Sort by Context Length</option>
          </select>
        </div>

        <select id="model-select" size="8">
          <option value="">Loading models...</option>
        </select>

        <div id="model-info" class="model-info"></div>

        <button id="save-settings-btn" class="btn">Save</button>
      </div>
    </div>

    <main id="messages" class="messages"></main>

    <form id="chat-form" class="chat-form">
      <textarea
        id="message-input"
        placeholder="Type your message..."
        rows="1"
        autocomplete="off"
      ></textarea>
      <button type="submit" id="send-btn" class="btn send-btn">Send</button>
    </form>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
